server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# `types {}` remplace entièrement la table MIME par défaut de nginx au lieu
	# de l'étendre : il faut réinclure mime.types explicitement, sinon .html/.js
	# retombent en application/octet-stream (et les modules ES refusent de charger).
	include /etc/nginx/mime.types;
	types {
		application/wasm wasm;
	}

	# Cache désactivé pour le dev local : on veut voir chaque changement au reload.
	add_header Cache-Control "no-cache";

	location / {
		try_files $uri $uri/ =404;
	}
}
